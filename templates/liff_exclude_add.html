<!doctype html>
<html lang="ja">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>{{ page_title }}</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Noto+Sans+JP:wght@400;500;700&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="{{ url_for('static', filename='liff.css') }}">
</head>
<body data-mode="add">
  <main class="shell">
    <section class="panel">
      <p class="eyebrow">LIFF</p>
      <h1>通知された日付を除外に追加</h1>
      <p class="intro">日付を選ぶとその日の全時間帯が選択されます。個別に外したい場合は時間帯のプルダウンから選択してください。</p>
      <div id="status" class="status">読み込み中...</div>
      <form id="selection-form" class="hidden">
        <div id="date-list" class="date-list"></div>
        <button id="submit-button" class="primary" type="submit">選択した日付を除外する</button>
      </form>
    </section>
  </main>
  <script>
    window.appConfig = {
      liffId: "{{ liff_id }}",
      mode: "add"
    };
  </script>
  <script src="https://static.line-scdn.net/liff/edge/2/sdk.js"></script>
  <script src="{{ url_for('static', filename='liff.js') }}"></script>
</body>
</html>
