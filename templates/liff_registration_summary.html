<!doctype html>
<html lang="ja">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>{{ page_title }}</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Noto+Sans+JP:wght@400;500;700&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="{{ url_for('static', filename='liff.css') }}">
</head>
<body>
  <main class="shell">
    <section class="panel">
      <p class="eyebrow">LIFF</p>
      <h1>登録情報を確認</h1>
      <div id="status" class="status">読み込み中...</div>
      <div id="summary-view" class="summary-view hidden">
        <section class="summary-section">
          <h2>通知設定</h2>
          <dl id="summary-meta" class="summary-meta"></dl>
        </section>
        <section class="summary-section">
          <h2>最新の空き状況</h2>
          <div id="latest-available-dates" class="summary-lines"></div>
        </section>
        <section class="summary-section">
          <h2>除外日時</h2>
          <div id="exception-dates" class="summary-lines"></div>
        </section>
      </div>
    </section>
  </main>
  <script>
    window.appConfig = {
      liffId: "{{ liff_id }}"
    };
  </script>
  <script src="https://static.line-scdn.net/liff/edge/2/sdk.js"></script>
  <script src="{{ url_for('static', filename='registration_summary.js') }}"></script>
</body>
</html>
